<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The first day, as a timeline of releases</title>
  <desc id="d">Top lane, the CLI repository: package and pipeline, v0.1.0 on PyPI, then the dev branch with the scope and the command. Bottom lane, the site: v0.1.0, v0.1.1, v0.2.0, v0.3.0. Three markers for what went wrong: a certificate check, a converter bug, a page refused by the gate.</desc>
  <rect width="960" height="400" fill="#faf9f5"/>
  <text x="24" y="40" font-size="12" font-weight="700" letter-spacing="2" fill="#5c5f66">24 OCTOBER 2026 · ONE SESSION</text>
  <!-- lanes -->
  <text x="24" y="104" font-size="13" font-weight="700" fill="#101114">CLI</text>
  <text x="24" y="122" font-size="11" fill="#5c5f66">SHarness-AI__CLI</text>
  <line x1="140" y1="108" x2="936" y2="108" stroke="#d5d0c2" stroke-width="2"/>
  <text x="24" y="284" font-size="13" font-weight="700" fill="#101114">Site</text>
  <text x="24" y="302" font-size="11" fill="#5c5f66">sharness.ai</text>
  <line x1="140" y1="288" x2="936" y2="288" stroke="#d5d0c2" stroke-width="2"/>
  <g font-size="12">
    <!-- CLI events -->
    <circle cx="170" cy="108" r="8" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
    <text x="158" y="80" font-weight="700" fill="#115e59">package + pipeline</text><text x="158" y="140" fill="#5c5f66" font-size="11">workflow.yml · OIDC</text>
    <circle cx="330" cy="108" r="8" fill="#0f766e"/>
    <text x="318" y="80" font-weight="700" fill="#115e59">v0.1.0 on PyPI</text><text x="318" y="140" fill="#5c5f66" font-size="11">published by CI, run 1</text>
    <circle cx="780" cy="108" r="8" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
    <text x="700" y="80" font-weight="700" fill="#115e59">dev: scope + sharness-ai</text><text x="700" y="140" fill="#5c5f66" font-size="11">not released yet</text>
    <!-- site events -->
    <circle cx="390" cy="288" r="8" fill="#0f766e"/>
    <text x="364" y="260" font-weight="700" fill="#115e59">v0.1.0</text><text x="352" y="320" fill="#5c5f66" font-size="11">site + gate + pipeline</text>
    <circle cx="520" cy="288" r="8" fill="#0f766e"/>
    <text x="500" y="260" font-weight="700" fill="#115e59">v0.1.1</text><text x="486" y="320" fill="#5c5f66" font-size="11">comms correction</text>
    <circle cx="690" cy="288" r="8" fill="#0f766e"/>
    <text x="668" y="260" font-weight="700" fill="#115e59">v0.2.0</text><text x="626" y="320" fill="#5c5f66" font-size="11">design for review: 11 pages</text>
    <circle cx="870" cy="288" r="8" fill="#0f766e"/>
    <text x="848" y="260" font-weight="700" fill="#115e59">v0.3.0</text><text x="842" y="320" fill="#5c5f66" font-size="11">articles</text>
  </g>
  <!-- what went wrong -->
  <g font-size="11" fill="#b45309">
    <path d="M455 198 l9 -16 l9 16 z" fill="#ffffff" stroke="#b45309" stroke-width="2"/><text x="464" y="196" text-anchor="middle" font-weight="700" font-size="10">!</text>
    <text x="464" y="218" text-anchor="middle">certificate check</text><text x="464" y="232" text-anchor="middle">could not see it</text>
    <path d="M606 198 l9 -16 l9 16 z" fill="#ffffff" stroke="#b45309" stroke-width="2"/><text x="615" y="196" text-anchor="middle" font-weight="700" font-size="10">!</text>
    <text x="615" y="218" text-anchor="middle">converter: bold</text><text x="615" y="232" text-anchor="middle">around code</text>
    <path d="M736 198 l9 -16 l9 16 z" fill="#ffffff" stroke="#b45309" stroke-width="2"/><text x="745" y="196" text-anchor="middle" font-weight="700" font-size="10">!</text>
    <text x="745" y="218" text-anchor="middle">gate refused</text><text x="745" y="232" text-anchor="middle">undated figures</text>
  </g>
  <text x="24" y="372" font-size="11" fill="#5c5f66">Filled: released and tagged by CI. Hollow: committed, not released. Triangles: the three things that went wrong, each caught the same day.</text>
</svg>
