<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 688" width="1100" height="688" role="img" aria-labelledby="t">
<title id="t">sharness-ai explain, as designed: the same policy drawn down the grid, one box per level, a hash beside each, with the row that came from a lower level marked</title>
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;white-space:pre}.c{animation:b 1.1s steps(2) infinite}@keyframes b{to{opacity:0}}@media(prefers-reduced-motion:reduce){.c{animation:none}}</style>
<rect width="1100" height="688" rx="14" fill="#0b1020"/>
<rect x="0" y="0" width="1100" height="34" rx="14" fill="#161b2e"/><circle cx="24" cy="17" r="6" fill="#ff5f57"/><circle cx="44" cy="17" r="6" fill="#febc2e"/><circle cx="64" cy="17" r="6" fill="#28c840"/>
<text x="550" y="22" text-anchor="middle" fill="#9ca3af" font-size="13">designed 26 Oct 2026, not yet code: the column of the grid for one document</text>
<text x="24" y="70" fill="#e5e7eb">$ sharness-ai explain my-agent.pbp</text>
<text x="24" y="114" fill="#67e8f9">sharness-ai explain   one document, every level below it, hash by hash</text>
<text x="24" y="158" fill="#c4b5fd">  5 intent    ┌────────────────────────────────────────────────────────────────────┐  sha256:9f31…c2a0  what you wrote</text>
<text x="24" y="180" fill="#c4b5fd">              │ contain claude to ./my-repo, github.com and pypi.org, no secrets   │</text>
<text x="24" y="202" fill="#c4b5fd">              └──────────────────────────────┬─────────────────────────────────────┘</text>
<text x="24" y="224" fill="#c4b5fd">  4 profile   ┌──────────────────────────────┴─────────────────────────────────────┐  sha256:52be…7d10  the vendor&#x27;s</text>
<text x="24" y="246" fill="#c4b5fd">              │ coding-agent  workspace=./my-repo  sites=[github.com, pypi.org]     │</text>
<text x="24" y="268" fill="#c4b5fd">              └──────────────────────────────┬─────────────────────────────────────┘</text>
<text x="24" y="290" fill="#c4b5fd">  3 rows      ┌──────────────────────────────┴─────────────────────────────────────┐  sha256:3b8a…e1c0  what a manager reads</text>
<text x="24" y="312" fill="#c4b5fd">              │ read /usr /lib /etc ./my-repo · write ./my-repo · exec /usr/bin    │</text>
<text x="24" y="334" fill="#c4b5fd">              │ sites github.com pypi.org · secrets none · memory 2 GiB · pids 64  │</text>
<text x="24" y="356" fill="#fbbf24">              │ net: port 8443                           ← level 1 row, passed through unchanged</text>
<text x="24" y="378" fill="#c4b5fd">              └──────────────────────────────┬─────────────────────────────────────┘</text>
<text x="24" y="400" fill="#c4b5fd">  2 manifest  ┌──────────────────────────────┴─────────────────────────────────────┐  sha256:c01d…88f2  the architecture</text>
<text x="24" y="422" fill="#c4b5fd">              │ sharness.fs.disk (live) · sharness.net.direct (live) · edges app→fs │</text>
<text x="24" y="444" fill="#c4b5fd">              │ app→net · hosts → ports 443, 8443 · unheld: host names (no net here)│</text>
<text x="24" y="466" fill="#c4b5fd">              └──────────────────────────────┬─────────────────────────────────────┘</text>
<text x="24" y="488" fill="#c4b5fd">  1 kernel    ┌──────────────────────────────┴─────────────────────────────────────┐  sha256:77e4…0b9a  what Landlock is told</text>
<text x="24" y="510" fill="#c4b5fd">              │ 9 path rules · 2 TCP rules (443, 8443) · RLIMIT_AS 2 GiB · pids 64  │</text>
<text x="24" y="532" fill="#c4b5fd">              │ no_new_privs · closerange(3) · the hash in SHARNESS_AI_POLICY_HASH  │</text>
<text x="24" y="554" fill="#c4b5fd">              └────────────────────────────────────────────────────────────────────┘</text>
<text x="24" y="576" fill="#4ade80">  0 ground    measured by sharness-ai hello: 6 of 6 held on this kernel, 26 Oct 2026</text>
<text x="24" y="620" fill="#f9a8d4">  one row deeper   sharness-ai policy edit my-agent.pbp --level 3     change a row where a manager would</text>
<text x="24" y="642" fill="#e5e7eb">$ <tspan class="c">▌</tspan></text></svg>