<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Three years of one release scheme, and the three days it took this site to adopt it</title>
  <desc id="d">Top lane, 2021 to 2026: tags by hand in OSBot-Utils; 27 October 2023 the first increment-tag action and CI's first tag, v0.8.1; May and June 2024 the action moves into OSBot-GitHub-Actions as git__increment-tag; 2025 sgit and the send app; 24 October 2026 the SHarness CLI; 26 October 2026 this site. Bottom lane, 24 to 26 October 2026 on sharness.ai: the committer guesses the number; seven releases in sixteen minutes, three collide; two pushes seconds apart leave dev stuck at v0.5.32; a merge-commit tip sticks it again at v0.5.38; R23 decided; v0.6.6 is the first release commit CI writes.</desc>
  <rect width="960" height="460" fill="#faf9f5"/>
  <text x="24" y="40" font-size="12" font-weight="700" letter-spacing="2" fill="#5c5f66">ONE RELEASE SCHEME · 2023 TO 2026</text>
  <text x="24" y="104" font-size="13" font-weight="700" fill="#101114">Origin</text>
  <text x="24" y="122" font-size="11" fill="#5c5f66">owasp-sbot</text>
  <line x1="140" y1="108" x2="936" y2="108" stroke="#d5d0c2" stroke-width="2"/>
  <g font-size="12">
    <circle cx="170" cy="108" r="8" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/>
    <text x="150" y="80" font-weight="700" fill="#101114">2021 to 2023</text><text x="150" y="140" fill="#5c5f66" font-size="11">tags by hand: three in two years</text>
    <circle cx="360" cy="108" r="8" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
    <text x="300" y="80" font-weight="700" fill="#115e59">27 Oct 2023, 02:02 UTC</text><text x="300" y="140" fill="#5c5f66" font-size="11">increment-tag-dev / -main; CI tags v0.8.1</text>
    <circle cx="560" cy="108" r="8" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
    <text x="500" y="80" font-weight="700" fill="#115e59">May to June 2024</text><text x="500" y="140" fill="#5c5f66" font-size="11">git__increment-tag, one shared action</text>
    <circle cx="730" cy="108" r="8" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
    <text x="690" y="80" font-weight="700" fill="#115e59">2025</text><text x="690" y="140" fill="#5c5f66" font-size="11">sgit, the send app, every site</text>
    <circle cx="900" cy="108" r="8" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
    <text x="830" y="80" font-weight="700" fill="#115e59">24 to 26 Oct 2026</text><text x="830" y="140" fill="#5c5f66" font-size="11">the CLI, then this site</text>
  </g>
  <text x="24" y="196" font-size="11" fill="#5c5f66">1,129 tags on OSBot-Utils alone, every one a commit CI wrote: "Update release badge and version file"</text>
  <text x="24" y="284" font-size="13" font-weight="700" fill="#101114">This site</text>
  <text x="24" y="302" font-size="11" fill="#5c5f66">sharness.ai</text>
  <line x1="140" y1="288" x2="936" y2="288" stroke="#d5d0c2" stroke-width="2"/>
  <g font-size="12">
    <circle cx="170" cy="288" r="8" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/>
    <text x="150" y="260" font-weight="700" fill="#101114">24 Oct, 16:37</text><text x="150" y="320" fill="#5c5f66" font-size="11">v0.1.0: the committer</text><text x="150" y="336" fill="#5c5f66" font-size="11">guesses the number</text>
    <circle cx="345" cy="288" r="8" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/>
    <text x="300" y="260" font-weight="700" fill="#101114">25 Oct, 23:42 to 23:58</text><text x="300" y="320" fill="#5c5f66" font-size="11">seven releases, four agents,</text><text x="300" y="336" fill="#5c5f66" font-size="11">three collide</text>
    <circle cx="520" cy="288" r="8" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/>
    <text x="480" y="260" font-weight="700" fill="#101114">26 Oct, 01:31</text><text x="480" y="320" fill="#5c5f66" font-size="11">two pushes 12 s apart:</text><text x="480" y="336" fill="#5c5f66" font-size="11">dev stuck at v0.5.32</text>
    <circle cx="680" cy="288" r="8" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/>
    <text x="645" y="260" font-weight="700" fill="#101114">26 Oct, 01:43</text><text x="645" y="320" fill="#5c5f66" font-size="11">a merge-commit tip:</text><text x="645" y="336" fill="#5c5f66" font-size="11">stuck again at v0.5.38</text>
    <circle cx="840" cy="288" r="8" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
    <text x="800" y="260" font-weight="700" fill="#115e59">26 Oct, 02:16 to 02:27</text><text x="800" y="320" fill="#5c5f66" font-size="11">R23 decided; v0.6.6 is the</text><text x="800" y="336" fill="#5c5f66" font-size="11">first release CI writes</text>
  </g>
  <text x="24" y="400" font-size="11" fill="#5c5f66">Before: the number is in the commit subject, chosen by whoever pushes; CI checks the guess and refuses when two guess alike.</text>
  <text x="24" y="420" font-size="11" fill="#115e59" font-weight="700">After: CI chooses the number inside one serialised job, writes /version, commits, tags that commit, deploys it. Nobody guesses.</text>
</svg>
