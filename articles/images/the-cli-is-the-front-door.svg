<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 594" width="1100" height="594" role="img" aria-labelledby="t">
<title id="t">sharness-ai with no arguments: the guide screen, as designed on 26 October 2026</title>
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;white-space:pre}.c{animation:b 1.1s steps(2) infinite}@keyframes b{to{opacity:0}}@media(prefers-reduced-motion:reduce){.c{animation:none}}</style>
<rect width="1100" height="594" rx="14" fill="#0b1020"/>
<rect x="0" y="0" width="1100" height="34" rx="14" fill="#161b2e"/><circle cx="24" cy="17" r="6" fill="#ff5f57"/><circle cx="44" cy="17" r="6" fill="#febc2e"/><circle cx="64" cy="17" r="6" fill="#28c840"/>
<text x="550" y="22" text-anchor="middle" fill="#9ca3af" font-size="13">$ sharness-ai        (designed 26 Oct 2026; not yet code when drawn)</text>
<text x="24" y="70" fill="#7dd3fc">   ____  _   _</text>
<text x="24" y="92" fill="#7dd3fc">  / ___|| | | | __ _ _ __ _ __   ___  ___ ___</text>
<text x="24" y="114" fill="#7dd3fc">  \___ \| |_| |/ _` | &#x27;__| &#x27;_ \ / _ \/ __/ __|      sharness-ai v0.1.0</text>
<text x="24" y="136" fill="#7dd3fc">   ___) |  _  | (_| | |  | | | |  __/\__ \__ \      status: experiments</text>
<text x="24" y="158" fill="#7dd3fc">  |____/|_| |_|\__,_|_|  |_| |_|\___||___/___/      https://sharness.ai</text>
<text x="24" y="202" fill="#e5e7eb">  where you are   Linux 6.18 · Landlock ABI 7 · uid 1000 · cgroups v2 (not writable)</text>
<text x="24" y="224" fill="#9ca3af">                  a policy will hold here: files and TCP ports by the kernel; network: none</text>
<text x="24" y="246" fill="#9ca3af">                  by Landlock TCP rules (an empty namespace needs uid 0 or a user namespace)</text>
<text x="24" y="290" fill="#4ade80">  the ladder      ✔ 1  probe      the grant: what a process here can do before any policy</text>
<text x="24" y="312" fill="#4ade80">                  ✔ 2  hello      the acceptance test: six probes under one policy, 6 of 6 held</text>
<text x="24" y="334" fill="#fbbf24">                  ○ 3  policy     write one for your tool: sharness-ai policy new</text>
<text x="24" y="356" fill="#fbbf24">                  ○ 4  run        your command under it: sharness-ai run --policy FILE -- CMD</text>
<text x="24" y="400" fill="#c4b5fd">  the policy      ┌─ files ─────────────────┐  ┌─ network ────────┐  ┌─ process ──────────┐</text>
<text x="24" y="422" fill="#c4b5fd">                  │ read  /usr /lib /etc .  │  │ connect_tcp 443  │  │ 256 MiB · pids 16  │</text>
<text x="24" y="444" fill="#c4b5fd">                  │ write /work/out         │  │ UDP not covered  │  │ no_new_privs       │</text>
<text x="24" y="466" fill="#c4b5fd">                  │ exec  /usr/bin /bin /lib│  └──────────────────┘  └────────────────────┘</text>
<text x="24" y="488" fill="#c4b5fd">                  └─────────────────────────┘  sha256:3b8a…e1c0 · a Boundary for the child</text>
<text x="24" y="532" fill="#f9a8d4">  what next?      1 probe   2 hello   3 new policy   4 run a command   5 translate   6 components   q</text>
<text x="24" y="554" fill="#e5e7eb">  &gt; <tspan class="c">▌</tspan></text>
</svg>