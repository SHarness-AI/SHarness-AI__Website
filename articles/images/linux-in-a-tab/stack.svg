<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">One guest, five layers deep in a browser tab, and three ways to run it</title>
  <desc id="d">Nested boxes on the left. The browser tab contains v86, an x86 PC emulated in WebAssembly. v86 runs Linux 6.18.58 from Alpine, whose security modules include Landlock, which reports up and running. Linux runs /init, which runs sharness-ai in Python 3.12. sharness-ai starts a child under a Process Behaviour Policy: Landlock rules per path and per TCP port, an empty network namespace, memory and process caps, no_new_privs. hello held 6 of 6. On the right, three cards: in a browser (Dinis Cruz's Chrome, hello held at 28.5 seconds; headless Chromium 153, 75.9 seconds), in Node with no browser (58.0 seconds), and on the host kernel through chroot (under 2 seconds).</desc>
  <rect width="960" height="540" fill="#faf9f5"/>
  <text x="24" y="34" font-size="12" font-weight="700" letter-spacing="2" fill="#5c5f66">LINUX IN A TAB · 25 OCTOBER 2026</text>
  <!-- nested stack -->
  <rect x="24" y="52" width="584" height="468" rx="14" fill="#ffffff" stroke="#d5d0c2" stroke-width="2"/>
  <text x="44" y="78" font-size="14" font-weight="700" fill="#34363c">your browser tab</text>
  <text x="44" y="96" font-size="11.5" fill="#8a8d94">sharness.ai/code/browser/demo · 7 static files, 25 MB · no COOP/COEP headers</text>
  <rect x="44" y="110" width="544" height="394" rx="12" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="62" y="134" font-size="14" font-weight="700" fill="#5b21b6">v86 0.5.472: an x86 PC in WebAssembly</text>
  <text x="62" y="152" font-size="11.5" fill="#6b6f76">SeaBIOS · one i686 CPU · 512 MiB RAM · a 16550 serial port, ttyS0</text>
  <rect x="62" y="166" width="508" height="322" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="80" y="190" font-size="14" font-weight="700" fill="#115e59">Linux 6.18.58, Alpine linux-virt, i686</text>
  <text x="80" y="208" font-size="11.5" fill="#34363c">LSM: lockdown, capability, <tspan font-weight="700" fill="#0f766e">landlock</tspan>, yama · "landlock: Up and running."</text>
  <rect x="80" y="222" width="472" height="250" rx="12" fill="#ffffff" stroke="#115e59" stroke-width="1.5"/>
  <text x="98" y="246" font-size="14" font-weight="700" fill="#34363c">/init → sharness-ai (Python 3.12, stdlib only)</text>
  <text x="98" y="264" font-size="11.5" fill="#6b6f76">probe · policy hash · run · hello · the seven example policies</text>
  <rect x="98" y="278" width="436" height="178" rx="12" fill="#0f766e"/>
  <text x="116" y="304" font-size="14" font-weight="700" fill="#ffffff">the child, under a Process Behaviour Policy</text>
  <g font-size="12" fill="#e6fffa">
    <text x="116" y="328">● Landlock: read, write, exec per path; TCP connect per port</text>
    <text x="116" y="348">● an empty network namespace</text>
    <text x="116" y="368">● RLIMIT_AS + memory cgroup · RLIMIT_NPROC + pids cgroup</text>
    <text x="116" y="388">● no_new_privs, then landlock_restrict_self: final</text>
  </g>
  <rect x="116" y="404" width="168" height="34" rx="17" fill="#ffffff"/>
  <text x="200" y="426" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">hello: 6 of 6 held</text>
  <text x="300" y="426" font-size="11" fill="#e6fffa">a Boundary for the child</text>
  <!-- three ways -->
  <text x="632" y="78" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5c5f66">THE SAME GUEST, THREE WAYS</text>
  <g font-size="12">
    <rect x="632" y="92" width="304" height="128" rx="12" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
    <text x="650" y="118" font-size="14" font-weight="700" fill="#5b21b6">1 · in a browser</text>
    <text x="650" y="142" fill="#34363c">Dinis's Chrome, live on sharness.ai</text>
    <text x="650" y="160" fill="#34363c">hello held at <tspan font-weight="700">28.5 s</tspan>, done at 32.2 s</text>
    <text x="650" y="184" fill="#34363c">headless Chromium 153, in this session</text>
    <text x="650" y="202" fill="#34363c">hello held at <tspan font-weight="700">75.9 s</tspan></text>
    <rect x="632" y="236" width="304" height="112" rx="12" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
    <text x="650" y="262" font-size="14" font-weight="700" fill="#5b21b6">2 · in Node, no browser</text>
    <text x="650" y="286" fill="#34363c">v86 in Node 22, the same files</text>
    <text x="650" y="304" fill="#34363c">hello held at <tspan font-weight="700">58.0 s</tspan></text>
    <text x="650" y="328" fill="#34363c">a second kernel for any CI job or agent</text>
    <rect x="632" y="364" width="304" height="112" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <text x="650" y="390" font-size="14" font-weight="700" fill="#115e59">3 · on the host kernel</text>
    <text x="650" y="414" fill="#34363c">chroot: the same i386 binaries, no emulator</text>
    <text x="650" y="432" fill="#34363c">Linux 6.18.44 · Landlock ABI 7</text>
    <text x="650" y="450" fill="#34363c">hello held in <tspan font-weight="700">under 2 s</tspan></text>
  </g>
  <text x="632" y="500" font-size="11" fill="#8a8d94">Timings are of an emulated single core:</text>
  <text x="632" y="515" font-size="11" fill="#8a8d94">they say what the page does, not what the harness costs.</text>
</svg>
