# Deploys sharness.ai (this repo's working tree) to GitHub Pages: validate → release → publish.
#
#   1. validate  — the pre-release gate (tools/validate.js: version agreement, internal links,
#                  canonical/CNAME agreement, key-leak tripwire, dated figures), plus the --check of
#                  each generator. A failure stops everything: no release, no publish. Also runs on
#                  pull requests, so branch work is gated before it reaches dev.
#   2. release   — CI owns the version (R23, the scheme of the send repository): the next number
#                  comes from the tags, inside this one serialised job, never from the committer. A
#                  push to dev bumps the last number (vX.Y.Z+1); a push to main bumps the middle one
#                  (vX.Y+1.0). tools/release.py writes /version, adds the row to the release history,
#                  re-stamps every page and runs the gate again; the job commits that as the actions
#                  user ("site vX.Y.Z: <the pushed commit's subject>"), tags the commit, pushes the
#                  branch and the tag. A push that lands while this runs is taken in before the bump,
#                  so no number is ever guessed twice and no release is ever left untagged. A commit
#                  that modifies /version by hand fails the job. A head already carrying its version
#                  (dev fast-forwarded to main after a minor) is published as it is.
#   3. deploy    — publishes the release commit, from dev or main, or on a manual run. Never when
#                  validation or the release failed, never from a pull request.
name: deploy-pages
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false                  # never interrupt a half-done tag/publish
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate the site (version, links, canonical, secret tripwire, SRI, pinned workflows, dated figures)
        run: node tools/validate.js
      - name: The published releases of the code are intact (no byte at an immutable path has changed)
        run: python3 tools/releases.py check
      - name: Design pages' HTML matches their markdown source
        run: python3 tools/gen_pages.py --check
      - name: Articles match their sources
        run: python3 tools/gen_articles.py --check
      - name: The admin section matches its sources (the board rows, the members, the updates, AGENTS.md, the snapshot)
        run: python3 tools/gen_admin.py --check
      - name: Storyboards match their sources and have their previews
        run: python3 tools/gen_storyboards.py --check
      - name: Storyboards are valid for the pinned kit (the kit's own validator)
        run: node tools/validate_storyboards.cjs

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    permissions:
      contents: write                        # pushes the release commit and the tag
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4  # zizmor: ignore[artipacked] - this job pushes the release commit and the tag
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: The release commit, tagged (tools/release.py)
        id: release
        env:
          BRANCH: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          git fetch --tags --quiet
          python3 tools/release.py guard "$BEFORE" HEAD
          for try in 1 2 3; do
            git fetch --quiet origin "$BRANCH"
            git reset -q --hard "origin/$BRANCH"            # whatever is newest: a push that landed meanwhile rides this release
            SUBJECT=$(git log -1 --format=%s HEAD)
            python3 tools/release.py bump --branch "$BRANCH" --subject "$SUBJECT" | tee release.out
            VERSION=$(grep -oP '^version=\K.*' release.out); SHA=$(grep -oP '^sha=\K.*' release.out); BUMPED=$(grep -oP '^bumped=\K.*' release.out)
            rm -f release.out
            if [ "$BUMPED" = "false" ]; then break; fi
            if git push origin "HEAD:$BRANCH"; then
              git push origin "refs/tags/$VERSION"
              echo "released $VERSION as ${SHA:0:9} on $BRANCH (attempt $try)"
              break
            fi
            echo "$BRANCH moved while the release was built; taking it in (attempt $try)"
            git tag -d "$VERSION"
            git checkout -q -- . ; git clean -fdq
            [ "$try" = 3 ] && { echo "::error::$BRANCH kept moving; nothing released"; exit 1; }
          done
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ "$BRANCH" = "main" ]; then
            # a minor on main: dev follows it, fast-forward only; if dev has moved on, say so and leave it
            git push origin "HEAD:dev" && echo "dev fast-forwarded to $VERSION" || echo "::notice::dev was not fast-forwarded to $VERSION (it has commits of its own); merge main into dev by hand"
          fi

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate, release]
    # Publish the release commit; on a manual run, the tree as it is. Never when validation or
    # the release failed, and never from a pull request.
    if: always() && github.event_name != 'pull_request' && needs.validate.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.sha || github.sha }}   # the release commit when there was one
      - name: Assemble site artifact
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a ./ "$RUNNER_TEMP/site/" --exclude '.git' --exclude '.github' --exclude '.sg_vault'
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
