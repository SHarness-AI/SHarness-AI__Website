<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The moving parts of SHarness</title>
  <desc id="d">The person, outside everything, supplies one policy hash and carries sealed QR codes. The launcher, outside every domain, checks the hash, makes users, a session CA and certificates, and starts the components. Inside the session: the harnessed app or orchestrator at the top, with no keys and no tools of its own, talking over mutual TLS to four components in a row: sharness.fs, sharness.net, sharness.bash and sharness.llm. Only net and llm talk to sharness.kms at the bottom, which never returns a clear key. fs writes the protected folders; net is the only path to the outside world; llm is the only path to the model API; bash runs each command in a fresh sandbox. Every component has its own uid, Landlock, seccomp and certificate.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c5f66"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#115e59"/></marker>
  </defs>
  <rect width="960" height="560" fill="#faf9f5"/>
  <!-- person -->
  <g font-size="12">
    <circle cx="70" cy="48" r="13" fill="#fff" stroke="#b45309" stroke-width="2"/>
    <path d="M48,90 a22,22 0 0 1 44,0" fill="#fff" stroke="#b45309" stroke-width="2"/>
    <text x="100" y="40" font-weight="700" fill="#b45309">the person</text>
    <text x="100" y="56" fill="#34363c">supplies one policy hash,</text>
    <text x="100" y="71" fill="#34363c">sha256:M, out of band;</text>
    <text x="100" y="86" fill="#34363c">carries sealed QR codes</text>
  </g>
  <!-- launcher -->
  <rect x="300" y="26" width="636" height="64" rx="10" fill="#fff" stroke="#6d28d9" stroke-width="2"/>
  <text x="316" y="48" font-size="13" font-weight="700" fill="#6d28d9">sharness.launcher · outside every domain</text>
  <text x="316" y="66" font-size="11" fill="#34363c">refuses unless hash(manifest) = sha256:M · makes one uid per component, a session CA and one certificate per role,</text>
  <text x="316" y="81" font-size="11" fill="#34363c">then destroys the CA key · starts, freezes and stops the components · in the end state, the platform runs it</text>
  <line x1="262" y1="58" x2="298" y2="58" stroke="#b45309" stroke-width="2" marker-end="url(#a)"/>
  <text x="272" y="52" font-size="10" fill="#b45309">M</text>
  <!-- session -->
  <rect x="30" y="112" width="900" height="420" rx="14" fill="none" stroke="#d5d0c2" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="46" y="134" font-size="11" font-weight="700" letter-spacing="1.5" fill="#8a8d94">ONE SESSION · EPHEMERAL · EVERY COMPONENT: OWN UID · LANDLOCK · SECCOMP · NAMESPACES · CGROUPS · ONE CERTIFICATE</text>
  <!-- app -->
  <rect x="330" y="150" width="300" height="62" rx="10" fill="#fff" stroke="#1c1d21" stroke-width="2"/>
  <text x="480" y="174" font-size="13" font-weight="700" fill="#1c1d21" text-anchor="middle">the harnessed app / orchestrator</text>
  <text x="480" y="192" font-size="11.5" fill="#5c5f66" text-anchor="middle">sgit's CLI, a Claude Code session, your own loop</text>
  <text x="480" y="206" font-size="11.5" fill="#b91c1c" text-anchor="middle">no keys · no network · no writes · runs nothing itself</text>
  <!-- components row -->
  <g font-size="11.5">
    <rect x="60" y="300" width="180" height="78" rx="10" fill="#fff" stroke="#0f766e" stroke-width="2"/>
    <text x="150" y="322" font-size="13" font-weight="700" fill="#115e59" text-anchor="middle">sharness.fs</text>
    <text x="150" y="340" fill="#34363c" text-anchor="middle">only writer of protected folders</text>
    <text x="150" y="355" fill="#34363c" text-anchor="middle">path rules · refuses clear keys</text>
    <text x="150" y="370" fill="#8a8d94" text-anchor="middle">no network · talks to nobody</text>

    <rect x="280" y="300" width="180" height="78" rx="10" fill="#fff" stroke="#0f766e" stroke-width="2"/>
    <text x="370" y="322" font-size="13" font-weight="700" fill="#115e59" text-anchor="middle">sharness.net</text>
    <text x="370" y="340" fill="#34363c" text-anchor="middle">the only network client</text>
    <text x="370" y="355" fill="#34363c" text-anchor="middle">the TLS client: host, endpoint,</text>
    <text x="370" y="370" fill="#34363c" text-anchor="middle">vault-id allowlists</text>

    <rect x="500" y="300" width="180" height="78" rx="10" fill="#fff" stroke="#0f766e" stroke-width="2"/>
    <text x="590" y="322" font-size="13" font-weight="700" fill="#115e59" text-anchor="middle">sharness.bash</text>
    <text x="590" y="340" fill="#34363c" text-anchor="middle">each command in a fresh sandbox</text>
    <text x="590" y="355" fill="#34363c" text-anchor="middle">own uid · no network · no execute</text>
    <text x="590" y="370" fill="#34363c" text-anchor="middle">right on the workspace · output filtered</text>

    <rect x="720" y="300" width="180" height="78" rx="10" fill="#fff" stroke="#0f766e" stroke-width="2"/>
    <text x="810" y="322" font-size="13" font-weight="700" fill="#115e59" text-anchor="middle">sharness.llm</text>
    <text x="810" y="340" fill="#34363c" text-anchor="middle">the only model API client</text>
    <text x="810" y="355" fill="#34363c" text-anchor="middle">Messages API · pinned tools · budget</text>
    <text x="810" y="370" fill="#34363c" text-anchor="middle">secret filter on every tool result</text>
  </g>
  <!-- app -> components edges -->
  <g stroke="#115e59" stroke-width="1.8" fill="none" marker-end="url(#ag)">
    <path d="M400,212 L150,298"/>
    <path d="M450,212 L370,298"/>
    <path d="M510,212 L590,298"/>
    <path d="M560,212 L810,298"/>
  </g>
  <text x="480" y="262" font-size="11" fill="#115e59" text-anchor="middle" font-weight="700">every edge: mutual TLS, roles in certificates, both sides check, schema on the payload</text>
  <!-- kms -->
  <rect x="330" y="440" width="300" height="72" rx="10" fill="#fff" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="480" y="463" font-size="13" font-weight="700" fill="#6d28d9" text-anchor="middle">sharness.kms</text>
  <text x="480" y="481" font-size="11.5" fill="#34363c" text-anchor="middle">holds the private keys in a memfd_secret page, frozen between calls</text>
  <text x="480" y="496" font-size="11.5" fill="#34363c" text-anchor="middle">opens sealed things, re-seals to one-time keys · never returns a clear key</text>
  <text x="480" y="508" font-size="10.5" fill="#8a8d94" text-anchor="middle">no files · no network · answers net and llm only</text>
  <g stroke="#6d28d9" stroke-width="1.8" fill="none" marker-end="url(#ag)">
    <path d="M370,380 L430,438"/>
    <path d="M810,380 L560,438" stroke-dasharray="4 3"/>
  </g>
  <text x="440" y="432" font-size="10.5" fill="#6d28d9">unwrap</text>
  <text x="640" y="432" font-size="10.5" fill="#6d28d9">the API key, sealed</text>
  <!-- outside -->
  <g font-size="11.5">
    <line x1="110" y1="378" x2="110" y2="440" stroke="#5c5f66" stroke-width="1.8" marker-end="url(#a)"/>
    <text x="110" y="458" fill="#34363c" text-anchor="middle">the clone folder, .sg_vault/</text>
    <text x="110" y="473" fill="#8a8d94" text-anchor="middle">sealed files only on disk</text>
    <line x1="810" y1="378" x2="810" y2="402" stroke="#5c5f66" stroke-width="1.8" marker-end="url(#a)"/>
    <text x="810" y="418" fill="#34363c" text-anchor="middle">→ the model API, with the real key</text>
    <line x1="280" y1="365" x2="250" y2="395" stroke="#5c5f66" stroke-width="1.8" marker-end="url(#a)"/>
    <text x="246" y="410" fill="#34363c" text-anchor="middle">→ the vault server, registries,</text>
    <text x="246" y="424" fill="#34363c" text-anchor="middle">the web, via the egress proxy</text>
  </g>
  <text x="46" y="548" font-size="10.5" fill="#8a8d94">Designed, not built. The edge matrix and the measured handshake cost (3.2 ms) are on the Architecture and Evidence pages.</text>
</svg>
