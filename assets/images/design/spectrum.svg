<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">From hello world to sgit: five profiles, one harness</title>
  <desc id="d">Five columns from left to right: P0 a hello world, one child process under a v0 policy; P1 a Claude Code session, the orchestrator under the launcher with bash and llm routed; P2 a tool or MCP server as a harnessed app with fs and net; P3 a newsroom agent, around the clock on untrusted data, with the dual-LLM split and read-only workspace; P4 sgit, harness-aware, with the KMS. Rows show which components each uses, the mode (transparent or harness-aware) and the status: P0 is runnable today, the rest designed.</desc>
  <rect width="960" height="400" fill="#faf9f5"/>
  <text x="24" y="30" font-size="12" font-weight="700" letter-spacing="2" fill="#5c5f66">THE SPECTRUM · THE SAME COMPONENTS, MORE OF THEM SWITCHED ON</text>
  <g font-size="11.5">
    <!-- columns -->
    <g font-weight="700" fill="#1c1d21" text-anchor="middle">
      <text x="150" y="70">P0 · hello world</text>
      <text x="320" y="70">P1 · a Claude Code session</text>
      <text x="490" y="70">P2 · a tool / MCP server</text>
      <text x="660" y="70">P3 · a newsroom agent</text>
      <text x="830" y="70">P4 · sgit</text>
    </g>
    <g fill="#5c5f66" text-anchor="middle" font-size="10.5">
      <text x="150" y="86">one child process, one policy</text>
      <text x="320" y="86">the launcher above the agent</text>
      <text x="490" y="86">a harnessed app, no secrets</text>
      <text x="660" y="86">24/7 on untrusted text</text>
      <text x="830" y="86">harness-aware: keys via the KMS</text>
    </g>
    <!-- rows -->
    <g fill="#34363c">
      <text x="24" y="124" font-weight="700">launcher</text>
      <text x="24" y="156" font-weight="700">fs</text>
      <text x="24" y="188" font-weight="700">net</text>
      <text x="24" y="220" font-weight="700">bash</text>
      <text x="24" y="252" font-weight="700">llm</text>
      <text x="24" y="284" font-weight="700">kms</text>
      <text x="24" y="316" font-weight="700">mode</text>
      <text x="24" y="348" font-weight="700">status</text>
    </g>
    <g stroke="#e5e1d5"><line x1="24" y1="100" x2="936" y2="100"/><line x1="24" y1="136" x2="936" y2="136"/><line x1="24" y1="168" x2="936" y2="168"/><line x1="24" y1="200" x2="936" y2="200"/><line x1="24" y1="232" x2="936" y2="232"/><line x1="24" y1="264" x2="936" y2="264"/><line x1="24" y1="296" x2="936" y2="296"/><line x1="24" y1="328" x2="936" y2="328"/></g>
    <!-- cells: ✔ in accent, · dim -->
    <g text-anchor="middle" font-size="12">
      <!-- launcher -->
      <text x="160" y="124" fill="#b45309">itself (a Setting)</text>
      <text x="320" y="124" fill="#115e59">a script, then the platform</text>
      <text x="490" y="124" fill="#115e59">✔</text><text x="660" y="124" fill="#115e59">the platform</text><text x="830" y="124" fill="#115e59">✔</text>
      <!-- fs -->
      <text x="160" y="156" fill="#8a8d94">Landlock, no writes</text>
      <text x="320" y="156" fill="#115e59">✔ the workspace</text>
      <text x="490" y="156" fill="#115e59">✔ its folder</text><text x="660" y="156" fill="#115e59">✔ read-only workspace</text><text x="830" y="156" fill="#115e59">✔ the clone, sealed files only</text>
      <!-- net -->
      <text x="160" y="188" fill="#8a8d94">none (empty namespace)</text>
      <text x="320" y="188" fill="#115e59">✔ allowlisted hosts</text>
      <text x="490" y="188" fill="#115e59">✔ its endpoints</text><text x="660" y="188" fill="#115e59">✔ feeds, the vault server</text><text x="830" y="188" fill="#115e59">✔ one host, one vault id</text>
      <!-- bash -->
      <text x="150" y="220" fill="#8a8d94">·</text>
      <text x="320" y="220" fill="#115e59">✔ profiles: analyse, build, admin</text>
      <text x="490" y="220" fill="#8a8d94">·</text><text x="660" y="220" fill="#115e59">✔ analyse only</text><text x="830" y="220" fill="#8a8d94">·</text>
      <!-- llm -->
      <text x="150" y="252" fill="#8a8d94">·</text>
      <text x="320" y="252" fill="#115e59">✔ at ANTHROPIC_BASE_URL</text>
      <text x="490" y="252" fill="#8a8d94">·</text><text x="660" y="252" fill="#115e59">✔ two: privileged + quarantined</text><text x="830" y="252" fill="#8a8d94">·</text>
      <!-- kms -->
      <text x="150" y="284" fill="#8a8d94">·</text>
      <text x="320" y="284" fill="#115e59">✔ the API key</text>
      <text x="490" y="284" fill="#8a8d94">·</text><text x="660" y="284" fill="#115e59">✔ API key, vault keys</text><text x="830" y="284" fill="#115e59">✔ vault keys, never clear</text>
      <!-- mode -->
      <text x="150" y="316" fill="#34363c">transparent</text>
      <text x="320" y="316" fill="#34363c">transparent</text>
      <text x="490" y="316" fill="#34363c">transparent</text><text x="660" y="316" fill="#34363c">transparent + sgit inside</text><text x="830" y="316" fill="#34363c">harness-aware</text>
      <!-- status -->
      <text x="150" y="348" fill="#115e59" font-weight="700">runnable (E04)</text>
      <text x="320" y="348" fill="#b45309">designed; sandbox as stand-in</text>
      <text x="490" y="348" fill="#b45309">designed</text><text x="660" y="348" fill="#b45309">designed</text><text x="830" y="348" fill="#b45309">designed; read-only cmds run</text>
    </g>
  </g>
  <text x="24" y="384" font-size="10.5" fill="#8a8d94">Each column adds components; none changes the protocol. A P0 policy is six keys; a P4 policy is the full schema, layers L0 to L5. Dates on the Spectrum page.</text>
</svg>
